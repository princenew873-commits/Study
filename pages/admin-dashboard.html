<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Admin Dashboard

</title>

<link rel="stylesheet"
href="../style.css">

</head>

<body>

<div class="dashboard-bg"></div>

<div class="auth-box glass">

<h1>

Admin Dashboard 🚀

</h1>

<p>

Upload Study Material

</p>

<!-- TITLE -->

<input
type="text"
id="title"
placeholder="PDF Title"
>

<!-- CLASS -->

<select id="className">

<option value="Class 10">

Class 10

</option>

<option value="Class 11">

Class 11

</option>

<option value="Class 12">

Class 12

</option>

<option value="JEE">

JEE

</option>

<option value="NEET">

NEET

</option>

<option value="NDA">

NDA

</option>

</select>

<!-- SUBJECT -->

<select id="subject">

<option value="Physics">

Physics

</option>

<option value="Chemistry">

Chemistry

</option>

<option value="Maths">

Maths

</option>

<option value="Biology">

Biology

</option>

<option value="English">

English

</option>

</select>

<!-- CATEGORY -->

<select id="category">

<option value="Notes">

Notes

</option>

<option value="Short Notes">

Short Notes

</option>

<option value="PYQ">

PYQ

</option>

<option value="Sample Paper">

Sample Paper

</option>

</select>

<!-- PDF -->

<input
type="file"
id="pdfFile"
>

<button id="uploadBtn">

Upload PDF

</button>

</div>

<script type="module">

import {

db,
storage

}

from "../firebase-config.js";

import {

ref,
uploadBytes,
getDownloadURL

}

from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

import {

collection,
addDoc

}

from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const uploadBtn =
document.getElementById("uploadBtn");

uploadBtn.addEventListener(
"click",

async ()=>{

const title =
document.getElementById("title").value;

const className =
document.getElementById("className").value;

const subject =
document.getElementById("subject").value;

const category =
document.getElementById("category").value;

const file =
document.getElementById("pdfFile").files[0];

if(!file){

alert("Select PDF");

return;

}

try{

/* STORAGE */

const storageRef =
ref(
storage,
"pdfs/" + Date.now() + file.name
);

await uploadBytes(
storageRef,
file
);

const pdfUrl =
await getDownloadURL(
storageRef
);

/* SAVE FIRESTORE */

await addDoc(
collection(db,"pdfs"),
{

title,
className,
subject,
category,
pdfUrl,
createdAt:
Date.now()

}
);

alert(
"PDF Uploaded Successfully ✅"
);

}catch(error){

alert(error.message);

}

});

</script>

</body>
</html>
