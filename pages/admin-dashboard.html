<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Admin Dashboard

</title>

<link rel="stylesheet"
href="../style.css">

</head>

<body>

<div class="dashboard-bg"></div>

<div class="auth-box glass">

<h1>

Admin Upload Panel 🚀

</h1>

<!-- TITLE -->

<input
type="text"
id="title"
placeholder="PDF Title"
>

<!-- THUMBNAIL -->

<input
type="text"
id="thumbnail"
placeholder="Thumbnail Image URL"
>

<!-- PDF LINK -->

<input
type="text"
id="pdfLink"
placeholder="PDF Link"
>

<!-- CLASS -->

<select id="className">

<option>Class 10</option>

<option>Class 11</option>

<option>Class 12</option>

<option>JEE</option>

<option>NEET</option>

<option>NDA</option>

</select>

<!-- SUBJECT -->

<select id="subject">

<option>Physics</option>

<option>Chemistry</option>

<option>Maths</option>

<option>Biology</option>

<option>English</option>

</select>

<!-- CATEGORY -->

<select id="category">

<option>Notes</option>

<option>Short Notes</option>

<option>PYQ</option>

<option>Sample Paper</option>

<option>Videos</option>

</select>

<button id="uploadBtn">

Upload Content

</button>

</div>

<script type="module">

import { db }
from "../firebase-config.js";

import {

collection,
addDoc

}

from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const uploadBtn =
document.getElementById("uploadBtn");

uploadBtn.addEventListener(
"click",

async ()=>{

const title =
document.getElementById("title").value;

const thumbnail =
document.getElementById("thumbnail").value;

const pdfLink =
document.getElementById("pdfLink").value;

const className =
document.getElementById("className").value;

const subject =
document.getElementById("subject").value;

const category =
document.getElementById("category").value;

try{

await addDoc(
collection(db,"materials"),
{

title,
thumbnail,
pdfLink,
className,
subject,
category,
createdAt:
Date.now()

}
);

alert(
"Content Uploaded ✅"
);

}catch(error){

alert(error.message);

}

});

</script>

</body>
</html>
