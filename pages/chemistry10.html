<script type="module">

import { db } from "../firebase-config.js";

import {

collection,
query,
where,
getDocs

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

async function loadMaterials(){

const q = query(

collection(db,"materials"),

where("subject","==","Chemistry"),

where("className","==","Class 10")

);

const querySnapshot = await getDocs(q);

querySnapshot.forEach((doc)=>{

const data = doc.data();

const card = `

<div class="material-item">

<img src="${data.thumbnail}" class="thumb">

<h3>${data.title}</h3>

<a href="${data.pdfLink}" target="_blank">

Open

</a>

</div>

`;

if(data.category==="Notes"){

document.getElementById("notesContainer").innerHTML += card;

}

else if(data.category==="Short Notes"){

document.getElementById("shortNotesContainer").innerHTML += card;

}

else if(data.category==="PYQs"){

document.getElementById("pyqContainer").innerHTML += card;

}

else if(data.category==="Sample Papers"){

document.getElementById("sampleContainer").innerHTML += card;

}

else if(data.category==="Videos"){

document.getElementById("videoContainer").innerHTML += card;

}

});

}

loadMaterials();

</script>
