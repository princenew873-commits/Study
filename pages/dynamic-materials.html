<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Materials</title>
<link rel="stylesheet" href="../style.css">
</head>

<body>
<div class="dashboard-bg"></div>

<nav>
<h1 class="logo" id="pageTitle">Materials</h1>
<div class="nav-links">
<a id="backBtn" href="#">Back</a>
<a href="../dashboard.html">Dashboard</a>
</div>
</nav>

<section class="welcome-box glass">
<h2 id="mainHeading">Materials</h2>
<p id="subText">Loading materials...</p>
</section>

<div id="materialsContainer" class="materials-list"></div>

<footer>Made with ❤️ by Chintu</footer>

<script type="module">
import { db } from "../firebase-config.js";

import {
  collection,
  query,
  where,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const params = new URLSearchParams(window.location.search);
const className = params.get("class");
const subject = params.get("subject");
const category = params.get("category");

const container = document.getElementById("materialsContainer");

document.getElementById("pageTitle").innerText = subject + " " + category;
document.getElementById("mainHeading").innerText = className + " " + subject + " " + category;
document.getElementById("subText").innerText = category === "Videos" ? "Chapter-wise expert video lectures." : "Available study materials.";
document.getElementById("backBtn").href =
  `dynamic-subject.html?class=${encodeURIComponent(className)}&subject=${encodeURIComponent(subject)}`;

function safeId(text){
  return text.replace(/[^a-zA-Z0-9]/g, "");
}

window.toggleChapter = function(id){
  const allContents = document.querySelectorAll(".chapter-content");
  const allTitles = document.querySelectorAll(".chapter-title");

  allContents.forEach(content => {
    if(content.id !== "chapter-" + id){
      content.style.display = "none";
    }
  });

  allTitles.forEach(title => {
    if(title.dataset.id !== id){
      title.innerHTML = title.innerHTML.replace("▼", "▶");
    }
  });

  const current = document.getElementById("chapter-" + id);
  const title = document.querySelector(`[data-id="${id}"]`);

  if(current.style.display === "none"){
    current.style.display = "grid";
    title.innerHTML = title.innerHTML.replace("▶", "▼");
  }else{
    current.style.display = "none";
    title.innerHTML = title.innerHTML.replace("▼", "▶");
  }
};

async function loadMaterials(){
  const q = query(
    collection(db, "materials"),
    where("className", "==", className),
    where("subject", "==", subject),
    where("category", "==", category)
  );

  const snapshot = await getDocs(q);

  container.innerHTML = "";

  if(snapshot.empty){
    container.innerHTML = `
      <div class="glass" style="padding:30px;text-align:center;border-radius:20px;color:white;margin:25px;">
        <h2>📭 No Materials Found</h2>
        <p>Content will be uploaded soon.</p>
      </div>
    `;
    return;
  }

  if(category === "Videos"){
    loadVideos(snapshot);
  }else{
    loadFiles(snapshot);
  }
}

function loadFiles(snapshot){
  snapshot.forEach((docSnap) => {
    const data = docSnap.data();

    container.innerHTML += `
      <div class="material-row glass">
        <img
          src="${getVideoThumbnail(data)}"
          class="list-thumb">

        <div>
          <h3>${data.title}</h3>

          <a
            href="pdf-viewer.html?url=${encodeURIComponent(data.pdfLink)}">
            Open PDF
          </a>
        </div>
      </div>
    `;
  });
}

function loadVideos(snapshot){
  const chapters = {};

  snapshot.forEach((docSnap) => {
    const data = docSnap.data();
    const chapter = data.chapterName || "Other Videos";

    if(!chapters[chapter]){
      chapters[chapter] = [];
    }

    chapters[chapter].push(data);
  });

  Object.keys(chapters).forEach((chapter) => {
    const id = safeId(chapter);

    function getYouTubeId(url){

if(!url) return null;

if(url.includes("youtu.be/")){
return url.split("youtu.be/")[1].split("?")[0];
}

if(url.includes("youtube.com/watch")){
return new URL(url).searchParams.get("v");
}

if(url.includes("youtube.com/embed/")){
return url.split("/embed/")[1].split("?")[0];
}

return null;

}

function getVideoThumbnail(data){

if(data.thumbnail && data.thumbnail.trim() !== ""){
return data.thumbnail;
}

const videoId =
getYouTubeId(data.pdfLink);

if(videoId){
return `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
}

return "https://picsum.photos/400/225";

}

    container.innerHTML += `
      <div class="glass chapter-box">
        <h2
          class="chapter-title"
          data-id="${id}"
          onclick="toggleChapter('${id}')">
          ▶ 📂 ${chapter} (${chapters[chapter].length} Videos)
        </h2>

        <div
          id="chapter-${id}"
          class="chapter-content"
          style="display:none;">
        </div>
      </div>
    `;

    const chapterDiv = document.getElementById("chapter-" + id);

    chapters[chapter].forEach((data) => {
      chapterDiv.innerHTML += `
        <a
          href="video-player.html?url=${encodeURIComponent(data.pdfLink)}"
          class="video-card">

          <div class="thumb-wrap">
            <img
              src="${getVideoThumbnail(data)}"
              class="video-thumb">

            <div class="play-badge">▶</div>
          </div>

          <div class="video-title">${data.title}</div>

          <div class="video-meta">
            ${data.subject} • ${data.className}
          </div>
        </a>
      `;
    });
  });
}

loadMaterials();
</script>

</body>
</html>
