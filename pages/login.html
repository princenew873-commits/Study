<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Login</title>

<link rel="stylesheet"
href="../style.css">

</head>

<body>

<div class="bg"></div>

<div class="auth-box">

<h1>Welcome Back 👋</h1>

<p>Login to continue</p>

<input
type="email"
id="email"
placeholder="Enter Email"
>

<input
type="password"
id="password"
placeholder="Enter Password"
>

<button id="loginBtn">

Login

</button>

<p class="bottom-text">

Don't have account?

<a href="signup.html">
Signup
</a>

</p>

</div>

<script type="module">

import { auth }
from "../firebase-config.js";

import {

signInWithEmailAndPassword

}

from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* LOGIN BUTTON */

const loginBtn =
document.getElementById("loginBtn");

loginBtn.addEventListener(
"click",

async ()=>{

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

try{

/* FIREBASE LOGIN */

const userCredential =
await signInWithEmailAndPassword(
auth,
email,
password
);

const user =
userCredential.user;

/* ADMIN UID */

const adminUID =
"eYqfCc489Qf3xMiaLotjTRYAGYR2";

/* CHECK */

alert(
"YOUR UID:\n\n" + user.uid
);

if(user.uid === adminUID){

alert("ADMIN");

window.location.href =
"./admin-dashboard.html";

}else{

alert("STUDENT");

window.location.href =
"../dashboard.html";

}
}catch(error){

alert(error.message);

}

});

</script>

</body>
</html>
