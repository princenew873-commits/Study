<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Login</title>

<link rel="stylesheet"
href="../style.css">

</head>

<body>

<div class="bg"></div>

<div class="auth-box">

<h1>Welcome Back 👋</h1>

<p>
Login to continue
</p>

<input
type="email"
id="email"
placeholder="Enter Email"
>

<input
type="password"
id="password"
placeholder="Enter Password"
>

<button id="loginBtn">

Login

</button>

<p class="bottom-text">

Don't have account?

<a href="signup.html">
Signup
</a>

</p>

</div>

<script type="module">

import { auth }
from "../firebase-config.js";

import {

signInWithEmailAndPassword

}

from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const loginBtn =
document.getElementById("loginBtn");

loginBtn.addEventListener(
"click",

()=>{

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

signInWithEmailAndPassword(
auth,
email,
password
)

.then((userCredential)=>{

const user =
userCredential.user;

/* YOUR ADMIN EMAIL */

const adminEmail =
"admin@gmail.com";

alert(
"Logged in as: " + user.email
);

/* ADMIN CHECK */

if(
user.email.trim().toLowerCase()
===
adminEmail.trim().toLowerCase()
){

window.location.href =
"./admin-dashboard.html";

}else{

window.location.href =
"../dashboard.html";

}

})

.catch((error)=>{

alert(error.message);

});

});

</script>

</body>
</html>
