
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PDF Viewer</title>

<style>

body{
margin:0;
padding:0;
background:#111827;
height:100vh;
}

iframe{
width:100%;
height:100vh;
border:none;
}

</style>

</head>

<body>

<iframe id="pdfFrame"></iframe>

<script>

const params =
new URLSearchParams(window.location.search);

const pdfUrl =
params.get("url");

const fileId =
pdfUrl.match(/\/d\/(.*?)\//)?.[1];

if(fileId){

document.getElementById("pdfFrame").src =
`https://drive.google.com/file/d/${fileId}/preview`;

}

</script>

</body>
</html>
