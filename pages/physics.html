<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Physics Resources
</title>

<link rel="stylesheet"
href="../style.css">

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
rel="stylesheet">

</head>

<body>

<!-- BACKGROUND -->

<div class="dashboard-bg"></div>

<!-- FLOATING ICONS -->

<div class="floating-books">

<span>⚡</span>
<span>📚</span>
<span>🧪</span>
<span>📐</span>

</div>

<!-- NAVBAR -->

<nav>

<h1 class="logo">
Physics Resources
</h1>

<div class="nav-links">

<a href="class10.html">
Back
</a>

<a href="../dashboard.html">
Dashboard
</a>

</div>

</nav>

<!-- TITLE -->

<section class="welcome-box glass">

<h2>
Physics Study Material ⚡
</h2>

<p>
Notes, PYQs, Sample Papers and Expert Videos
</p>

</section>

<!-- MATERIALS -->

<section
class="dashboard-grid"
id="materialsContainer">

</section>

<footer>
Made with ❤️ by Chintu
</footer>

<!-- FIREBASE SCRIPT -->

<script type="module">

import { db }
from "../firebase-config.js";

import {
collection,
getDocs,
query,
where
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const container =
document.getElementById(
"materialsContainer"
);

async function loadPhysicsMaterials(){

const q = query(
collection(db,"materials"),
where("subject","==","Physics")
);

const querySnapshot =
await getDocs(q);

container.innerHTML = "";

querySnapshot.forEach((doc)=>{

const data = doc.data();

container.innerHTML += `

<div class="dashboard-card glass">

<img
src="${data.thumbnail}"
style="
width:100%;
height:180px;
object-fit:cover;
border-radius:15px;
margin-bottom:15px;
"
>

<h2>
${data.title}
</h2>

<p>
${data.category}
</p>

<a
href="${data.pdfLink}"
target="_blank"
>

Open

</a>

</div>

`;

});

}

loadPhysicsMaterials();

</script>

</body>
</html>
