<script type="module">
import { db } from "../firebase-config.js";

import {
  collection,
  query,
  where,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const container = document.getElementById("materialsContainer");

function safeId(text){
  return text.replace(/[^a-zA-Z0-9]/g, "");
}

window.toggleChapter = function(id){
  const allContents = document.querySelectorAll(".chapter-content");
  const allTitles = document.querySelectorAll(".chapter-title");

  allContents.forEach(content => {
    if(content.id !== "chapter-" + id){
      content.style.display = "none";
    }
  });

  allTitles.forEach(title => {
    if(title.dataset.id !== id){
      title.innerHTML = title.innerHTML.replace("▼", "▶");
    }
  });

  const current = document.getElementById("chapter-" + id);
  const title = document.querySelector(`[data-id="${id}"]`);

  if(current.style.display === "none"){
    current.style.display = "grid";
    title.innerHTML = title.innerHTML.replace("▶", "▼");
  }else{
    current.style.display = "none";
    title.innerHTML = title.innerHTML.replace("▼", "▶");
  }
};

async function loadMaterials(){
  const q = query(
    collection(db, "materials"),
    where("subject", "==", "Physics"),
    where("className", "==", "Class 10"),
    where("category", "==", "Videos")
  );

  const querySnapshot = await getDocs(q);

  container.innerHTML = "";

  const chapters = {};

  querySnapshot.forEach((doc) => {
    const data = doc.data();
    const chapter = data.chapterName || "Other Videos";

    if(!chapters[chapter]){
      chapters[chapter] = [];
    }

    chapters[chapter].push(data);
  });

  Object.keys(chapters).forEach((chapter) => {
    const id = safeId(chapter);

    container.innerHTML += `
      <div class="glass chapter-box">
        <h2
          class="chapter-title"
          data-id="${id}"
          onclick="toggleChapter('${id}')">
          ▶ 📂 ${chapter} (${chapters[chapter].length} Videos)
        </h2>

        <div
          id="chapter-${id}"
          class="chapter-content"
          style="display:none;">
        </div>
      </div>
    `;

    const chapterDiv = document.getElementById("chapter-" + id);

    chapters[chapter].forEach((data) => {
      chapterDiv.innerHTML += `

      <div class="glass chapter-box">
        <h2
          class="chapter-title"
          data-id="${id}"
          onclick="toggleChapter('${id}')">
          ▶ 📂 ${chapter} (${chapters[chapter].length} Videos)
        </h2>

        <div
          id="chapter-${id}"
          class="chapter-content"
          style="display:none;">
        </div>
      </div>
    `;

    const chapterDiv = document.getElementById("chapter-" + id);

    chapters[chapter].forEach((data) => {
chapterDiv.innerHTML += `

<a
href="video-player.html?url=${encodeURIComponent(data.pdfLink)}"
class="video-card">

<div class="thumb-wrap">
<img
src="${data.thumbnail || 'https://picsum.photos/400/225'}"
class="video-thumb">

<div class="play-badge">▶</div>
</div>

<div class="video-title">
${data.title}
</div>

<div class="video-meta">
${data.subject} • ${data.className}
</div>

</a>

`;
    });
  });
}

loadMaterials();
    </script>
