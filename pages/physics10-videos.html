<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Physics Lectures 

</title>

<link rel="stylesheet"
href="../style.css">

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
rel="stylesheet">

</head>

<body>

<!-- BACKGROUND -->

<div class="dashboard-bg"></div>

<!-- NAVBAR -->

<nav>

<h1 class="logo">

Physics Lectures 

</h1>

<div class="nav-links">

<a href="physics10.html">

Back

</a>

<a href="../dashboard.html">

Dashboard

</a>

</div>

</nav>

<!-- TITLE -->

<section class="welcome-box glass">

<h2>

📝 Class 10 Physics Lectures 

</h2>

<p>

Expert Teacher's Lectures.

</p>

</section>

<!-- MATERIALS -->

<div
id="materialsContainer"
class="materials-list">

</div>

<!-- FOOTER -->

<footer>

Made with ❤️ by Chintu

</footer>


<script type="module">

import { db }
from "../firebase-config.js";

import {
collection,
query,
where,
getDocs
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const container =
document.getElementById(
"materialsContainer"
);

  window.toggleChapter = function(id){

const allChapters =
document.querySelectorAll(
".chapter-content"
);

allChapters.forEach((chapter)=>{

if(
chapter.id !== `chapter-${id}`
){

chapter.style.display = "none";

}

});

const current =
document.getElementById(
`chapter-${id}`
);

if(
current.style.display === "none"
){

current.style.display = "block";

}else{

current.style.display = "none";

}

};
  
async function loadMaterials(){

const q = query(

collection(db,"materials"),

where("subject","==","Physics"),

where("className","==","Class 10"),

where("category","==","Videos")

);

const querySnapshot =
await getDocs(q);

container.innerHTML = "";

const chapters = {};

querySnapshot.forEach((doc)=>{

const data =
doc.data();

const chapter =
data.chapterName || "Other Videos";

if(!chapters[chapter]){

chapters[chapter] = [];

}

chapters[chapter].push(data);

});

for(const chapter in chapters){

container.innerHTML += `

<div class="glass chapter-box">

<h2
class="chapter-title"
onclick="toggleChapter('${chapter.replace(/\s/g,'')}')">

▶ 📂 ${chapter}

</h2>

<div
id="chapter-${chapter.replace(/\s/g,'')}"
class="chapter-content"
style="display:none;">

</div>

</div>

`;

const chapterDiv =
document.getElementById(
`chapter-${chapter.replace(/\s/g,'')}`
);

chapters[chapter].forEach((data)=>{

chapterDiv.innerHTML += `

<div class="material-row glass">

<img
src="${data.thumbnail || 'https://picsum.photos/300/200'}"
class="list-thumb">

<div>

<h3>
${data.title}
</h3>

<a
href="video-player.html?url=${encodeURIComponent(data.pdfLink)}">

▶ Watch Video

</a>


</div>

</div>

`;

});

}

}

loadMaterials();

</script>
</body>

</html>
