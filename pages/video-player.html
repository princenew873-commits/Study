<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Video Player

</title>

<link rel="stylesheet"
href="../style.css">

<style>

body{

margin:0;
background:#000;

}

iframe,
video{

width:100%;
height:100vh;
border:none;

}

</style>

</head>

<body>

<div id="player"></div>

<script>

const params =
new URLSearchParams(
window.location.search
);

const url =
params.get("url");

const player =
document.getElementById("player");

if(

url.includes("youtube.com")
||

url.includes("youtu.be")

){

let videoId = "";
let videoId = "";

if(url.includes("youtu.be/")){

videoId =
url.split("youtu.be/")[1].split("?")[0];

}
else if(url.includes("youtube.com/watch")){

videoId =
new URL(url).searchParams.get("v");

}
else if(url.includes("youtube.com/embed/")){

videoId =
url.split("/embed/")[1].split("?")[0];

}
else if(url.includes("youtube.com/live/")){

videoId =
url.split("/live/")[1].split("?")[0];

}
player.innerHTML = `

<iframe

src="https://www.youtube.com/embed/${videoId}"

allowfullscreen>

</iframe>

`;

}

else{

player.innerHTML = `

<video controls>

<source
src="${url}">

</video>

`;

}

</script>

</body>

</html>
